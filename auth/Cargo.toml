[package]
name = "kaguya-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = { version = "0.14.2", features = ["router", "server"] }
tonic-prost = "0.14.2"
prost = "0.14.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
