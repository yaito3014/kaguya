# kaguya: Lore version-control server + Caddy (TLS edge) + auth (ReBAC), on its own VPS.
# Uses the shared Dex IdP on iroha (https://dex.<domain>/dex) as its issuer.
# Run ./setup.sh (after copying .env.example to .env) to render configs.
#
# No public loreserver image exists yet, so it is built from EpicGames/lore and
# loaded here (see README). QUIC is UDP and cannot pass through Caddy; it is
# published directly. Caddy issues the QUIC TLS cert (lore.<domain> site) and
# Lore reads it from the shared caddy-data volume. The auth service verifies Dex
# identities, enforces per-repository access from its ReBAC store, and mints the
# repository-scoped tokens Lore accepts; it is internal only.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"      # ACME HTTP-01 + redirect
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro   # rendered by setup.sh
      - caddy-data:/data        # certificates live here — do not delete
      - caddy-config:/config

  auth:
    image: kaguya-auth:0.2.0    # built from ./auth (see README)
    restart: unless-stopped
    # Verifies the caller's Dex token and mints a repository-scoped Lore token
    # signed with its own key; also serves the all-allow ReBAC API. It never
    # needs to be published (clients reach token exchange via Caddy on
    # LORE_AUTH_HOST), so it stays on the internal compose network only.
    environment:
      # Issuer to verify incoming identity tokens against (the Authentik "lore"
      # application), and their audience. (Env var name still says DEX; the value
      # is the OIDC issuer — Authentik now, Dex before.)
      KAGUYA_DEX_ISSUER: "${OIDC_ISSUER}"
      KAGUYA_JWT_AUDIENCE: "${LORE_HOST}"
      # Issuer stamped on minted tokens; must equal loreserver's jwt_issuer.
      KAGUYA_AUTH_ISSUER: "https://${LORE_AUTH_HOST}"
      KAGUYA_KEYS_DIR: "/keys"
      KAGUYA_DB_PATH: "/data/rebac.db"   # ReBAC store (owners, grants, groups)
    volumes:
      - auth-keys:/keys        # private signing key + published JWKS (see lore)
      - auth-data:/data        # ReBAC SQLite store
    # loreserver eagerly fetches the JWKS at startup and refuses to boot if it is
    # absent. This gate holds lore back until the auth service has written it, so
    # a fresh `up` does not crash-loop lore while the key is being generated.
    healthcheck:
      test: ["CMD-SHELL", "test -f /keys/jwks.json"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  lore:
    image: loreserver:v0.9.0    # built from EpicGames/lore and loaded here; see README
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_started
      auth:
        condition: service_healthy   # JWKS present before lore's startup fetch
    ports:
      - "41337:41337/udp"   # QUIC: clone / push
      - "41337:41337/tcp"   # gRPC
    volumes:
      - ./lore/local.toml:/etc/lore/config/local.toml:ro   # rendered by setup.sh
      - lore-data:/data                                    # immutable + mutable stores
      - caddy-data:/caddy-certs:ro                         # QUIC TLS cert issued by Caddy
      - auth-keys:/keys:ro     # JWKS for verifying exchanged tokens (file:// in local.toml)

  web:
    image: kaguya-web:0.1.0    # built from ./web (see README)
    restart: unless-stopped
    # Read-only web frontend (BFF). The browser reaches it via Caddy on
    # LORE_WEB_HOST; it is internal only (no published ports). It logs users in
    # through Dex and reads loreserver over gRPC per-user.
    depends_on:
      auth:
        condition: service_healthy
      lore:
        condition: service_started
    environment:
      # OIDC issuer = the Authentik "lore" application; client_id is shared with
      # the CLI (one public provider). (Env name still says DEX; value is OIDC.)
      KAGUYA_WEB_DEX_ISSUER: "${OIDC_ISSUER}"
      KAGUYA_WEB_CLIENT_ID: "${LORE_OIDC_CLIENT_ID}"
      KAGUYA_WEB_REDIRECT_URI: "https://${LORE_WEB_HOST}/auth/callback"
      KAGUYA_WEB_AUTH_GRPC: "http://auth:8080"
      KAGUYA_WEB_LORE_GRPC: "http://lore:41337"

volumes:
  caddy-data:
  caddy-config:
  lore-data:
  auth-keys:
  auth-data:
